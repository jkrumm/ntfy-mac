name: NtfyMac
options:
  bundleIdPrefix: com.jkrumm
  deploymentTarget:
    macOS: "15.0"
packages:
  NtfyMacPackage:
    path: ..
  # The direct channel's updater; linked into the app only (the CLI and every Sources/ module
  # stay free of it). Never below 2.9.6 (a local privilege escalation fix).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Exact: scripts/tools.sh pins the matching generate_appcast and sign_update; bump both together.
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  NtfyMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: NtfyMacPackage
        product: NtfyCore
      - package: NtfyMacPackage
        product: NtfyClient
      - package: NtfyMacPackage
        product: NtfyStore
      - package: NtfyMacPackage
        product: NtfyPlatform
      - package: NtfyMacPackage
        product: NtfyIPC
      - package: NtfyMacPackage
        product: NtfyAppLogic
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: NtfyMac
        PRODUCT_BUNDLE_IDENTIFIER: com.jkrumm.ntfy-mac
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Info.plist
      properties:
        CFBundleName: ntfy-mac
        CFBundleDisplayName: ntfy-mac
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "1"
        # Sparkle: the appcast is a release asset of this repo, signed with the EdDSA key whose
        # public half is below. The app is not sandboxed, so no sandbox keys.
        SUFeedURL: https://github.com/jkrumm/ntfy-mac/releases/latest/download/appcast.xml
        # A public key. The folded scalar keeps it off the `KEY: value` shape a secret guard takes.
        SUPublicEDKey: >-
          P7u515lvZDujVHzxnFqVSUg9AMAStN7cLQTWc8MHpfw=
        SUEnableAutomaticChecks: true
        SUVerifyUpdateBeforeExtraction: true
    postCompileScripts:
      - name: Bundle ntfy-mac CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cfg=$(echo "${CONFIGURATION}" | tr '[:upper:]' '[:lower:]')
          cd "${SRCROOT}/.."
          env -u SDKROOT -u MACOSX_DEPLOYMENT_TARGET -u CC -u CXX -u LD -u LIBRARY_PATH \
            xcrun swift build -c "${cfg}" --arch arm64 --product ntfy-mac --scratch-path .build/cli
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS"
          bin=$(env -u SDKROOT -u MACOSX_DEPLOYMENT_TARGET xcrun swift build -c "${cfg}" --arch arm64 --scratch-path .build/cli --show-bin-path)
          cp "${bin}/ntfy-mac" \
            "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/ntfy-mac"
