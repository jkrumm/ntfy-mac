name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26 # the app needs Xcode
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history
          token: ${{ secrets.RELEASE_TOKEN }} # PAT as jkrumm — bypasses branch protection ruleset

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # semantic-release 25 needs Node >= 22.14

      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck

      - name: Check
        run: make check

      # The plugins in .releaserc.json run in order: exec stamps the version and builds, signs and packages
      # dist/, github creates a draft release, uploads the assets and publishes it, git commits CHANGELOG.md.
      # No skip_npm_plugin: it replaces the plugin list from .releaserc.json with three plugins.
      # The action has no floating major tag, so pin the full version.
      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.10
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }} # must be PAT, not default token — github-actions[bot] has no bypass rights

  # Runs only after the release is published with its assets, so the formula never points at a missing file.
  tap:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: macos-26 # brew style needs Homebrew
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          repository: jkrumm/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          path: source

      - name: Download and verify the release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          gh release download "v${VERSION}" --repo jkrumm/ntfy-mac \
            --pattern "ntfy-mac-${VERSION}-arm64.tar.gz" --pattern SHA256SUMS --dir dist
          (cd dist && shasum -a 256 -c --ignore-missing --strict SHA256SUMS)
          sha256="$(shasum -a 256 "dist/ntfy-mac-${VERSION}-arm64.tar.gz" | cut -d' ' -f1)"
          echo "SHA256=${sha256}" >> "$GITHUB_ENV"

      - name: Render the formula
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: source/scripts/render-formula.sh "${VERSION}" "${SHA256}" > tap/Formula/ntfy-mac.rb

      - name: Commit
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ntfy-mac.rb
          git diff --cached --quiet && { echo "formula already up to date"; exit 0; }
          git commit -m "chore(ntfy-mac): update to v${VERSION}"

      # Taps the local checkout (with the new commit) so brew style applies the tap rules.
      - name: Style
        run: |
          brew tap jkrumm/tap "${GITHUB_WORKSPACE}/tap"
          brew style jkrumm/tap/ntfy-mac

      - name: Push
        run: git -C tap push
