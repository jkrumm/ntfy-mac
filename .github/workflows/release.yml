name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26 # the app needs Xcode
    timeout-minutes: 120 # notarization can queue for a long time
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history
          token: ${{ secrets.RELEASE_TOKEN }} # PAT as jkrumm — bypasses branch protection ruleset

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # semantic-release 25 needs Node >= 22.14

      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck

      # semantic-release tags first, so a missing secret must stop the run before it.
      - name: Require the signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD \
            ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Check
        run: make check

      # The Developer ID identity lives in a throwaway keychain that the cleanup step deletes.
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/ntfy-mac-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          printf '%s' "${P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/developer-id.p12" -P "${P12_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          rm -f "${RUNNER_TEMP}/developer-id.p12"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN_PATH=${keychain}" >> "$GITHUB_ENV"

      # The plugins in .releaserc.json run in order: exec stamps the version and builds, signs and packages
      # dist/, github creates a draft release, uploads the assets and publishes it, git commits CHANGELOG.md.
      # No skip_npm_plugin: it replaces the plugin list from .releaserc.json with three plugins.
      # The action has no floating major tag, so pin the full version.
      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.10
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }} # must be PAT, not default token — github-actions[bot] has no bypass rights
          SIGN_IDENTITY: developer-id # scripts/sign.sh: Developer ID, notarize, staple
          NOTARIZE: "1"
          NOTARY_TIMEOUT: 90m
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/developer-id.p12"
          [[ -z "${SIGNING_KEYCHAIN_PATH:-}" ]] || security delete-keychain "${SIGNING_KEYCHAIN_PATH}" || true

  # Runs only after the release is published with its assets, so the formula never points at a missing file.
  tap:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: macos-26 # brew style needs Homebrew
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          repository: jkrumm/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          path: source

      - name: Download and verify the release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          gh release download "v${VERSION}" --repo jkrumm/ntfy-mac \
            --pattern "ntfy-mac-${VERSION}-arm64.tar.gz" --pattern SHA256SUMS --dir dist
          (cd dist && shasum -a 256 -c --ignore-missing --strict SHA256SUMS)
          sha256="$(shasum -a 256 "dist/ntfy-mac-${VERSION}-arm64.tar.gz" | cut -d' ' -f1)"
          echo "SHA256=${sha256}" >> "$GITHUB_ENV"

      - name: Render the formula
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: source/scripts/render-formula.sh "${VERSION}" "${SHA256}" > tap/Formula/ntfy-mac.rb

      - name: Commit
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ntfy-mac.rb
          git diff --cached --quiet && { echo "formula already up to date"; exit 0; }
          git commit -m "chore(ntfy-mac): update to v${VERSION}"

      # Taps the local checkout (with the new commit) so brew style applies the tap rules.
      - name: Style
        run: |
          brew tap jkrumm/tap "${GITHUB_WORKSPACE}/tap"
          brew style jkrumm/tap/ntfy-mac

      - name: Push
        run: git -C tap push
