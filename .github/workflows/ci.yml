name: CI

on:
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: macos-26 # pinned image; macos-latest drifts
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # legacy TypeScript validation, removed with src/ in the cutover

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check
        run: make check

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed to read all commits in the PR

      - uses: wagoid/commitlint-github-action@v6
