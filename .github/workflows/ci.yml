name: CI

on:
  push:
    branches: [master] # most work lands here directly, so this is where CI has to run
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: macos-26 # pinned image; macos-latest drifts
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # SwiftPM checkouts and build products, and the pinned tools. The Xcode version is in the key because the
      # compiler's module cache is not portable across versions.
      - name: Cache SwiftPM and tools
        uses: actions/cache@v6
        with:
          path: |
            .build
            .tools
          key: spm-${{ runner.os }}-xcode-26.6-${{ hashFiles('Package.resolved', 'App/project.yml', 'scripts/tools.sh') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode-26.6-

      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck

      - name: Check
        run: make check

  commitlint:
    if: github.event_name == 'pull_request' # a direct push is linted by the local commit-msg hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to read all commits in the PR

      # No commitlint config in the repo: the action falls back to config-conventional.
      - uses: wagoid/commitlint-github-action@v6
