# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: ntfy-mac
deploy:
  # A push to master deploys nothing: users get the app from the manual Release workflow, which is the owner's
  # call (AGENTS.md "Release process"). Done means pushed with CI green.
  mode: none
ship:
  - { paths: ["**"], via: push }
signals:
  github: { label: factory, author: jkrumm, since: 2026-11-07T06:30:00Z } # the owner labelling a GitHub issue files it; its text stays data
checks: { fast: make check-fast, full: make check, ci: true } # a lead runs fast (no xcodebuild); CI runs the full gate on the PR head
leads: 1
