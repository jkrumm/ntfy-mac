# How the factory ships this project (software-factory docs/project.md: the keys and why each is set).
apiVersion: factory/v2
name: ntfy-mac
deploy:
  # A push to master deploys nothing: users get the app from the manual Release workflow, which is the owner's
  # call (AGENTS.md "Release process"). Done means pushed with CI green.
  mode: none
ship:
  - { via: push }
signals:
  github: { label: factory, author: jkrumm, since: 2026-11-07T06:30:00Z } # the owner labelling a GitHub issue files it; its text stays data
checks: { fast: make check-fast, full: make check, ci: true } # a lead runs fast (no xcodebuild); CI runs the full gate on the PR head
# No lead cap: the only shared resource is xcodebuild, and `scripts/apple-slot.sh` already serialises it (`lockf` plus a factory slot) for `app` and `snapshots`, which a lead never runs (CI does).
# The weekly hygiene pass cannot run `make check` here: apple-guard refuses xcodebuild outside CI. It runs the lead tier
# instead; CI runs the full gate on every PR head.
hygiene:
  check: false
  reason: "make check runs xcodebuild, which apple-guard refuses outside CI; CI runs it on every PR head"
  probes: [{ name: check-fast, target: check-fast }]
